<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio de Janeiro Toy City - Cars & Bikes</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-width: 320px;
            z-index: 100;
        }
        h1 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: #2980b9;
        }
        button.active {
            background: #27ae60;
        }
        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .value-display {
            text-align: right;
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🚗 Rio Toy City 🏖️</h1>
        
        <div class="control-group">
            <label>Vehicle Count: <span id="vehicleCountValue" class="value-display">15</span></label>
            <input type="range" id="vehicleCount" min="5" max="40" value="15">
        </div>
        
        <div class="control-group">
            <label>Speed: <span id="speedValue" class="value-display">1.0</span></label>
            <input type="range" id="speed" min="0.5" max="3.0" step="0.1" value="1.0">
        </div>
        
        <div class="control-group">
            <button id="toggleTunnel">Toggle Tunnel Cutaway</button>
        </div>
        
        <div class="control-group">
            <button id="followVehicle">Follow Vehicle</button>
            <button id="resetCamera">Reset Overview</button>
        </div>
        
        <div class="control-group">
            <label>Camera Presets:</label>
            <div class="preset-buttons">
                <button data-preset="full">Full Table</button>
                <button data-preset="beach">Beach View</button>
                <button data-preset="statue">Statue Close-up</button>
                <button data-preset="street">Street Level</button>
            </div>
        </div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Scene setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 80, 200);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 40, 50);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 10;
        controls.maxDistance = 150;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -60;
        sunLight.shadow.camera.right = 60;
        sunLight.shadow.camera.top = 60;
        sunLight.shadow.camera.bottom = -60;
        scene.add(sunLight);
        
        // Play table base
        const tableGeometry = new THREE.BoxGeometry(120, 3, 120);
        const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const tableBase = new THREE.Mesh(tableGeometry, tableMaterial);
        tableBase.position.y = -1.5;
        tableBase.receiveShadow = true;
        scene.add(tableBase);
        
        const tableTopGeometry = new THREE.BoxGeometry(118, 1, 118);
        const tableTopMaterial = new THREE.MeshStandardMaterial({ color: 0xDEB887 });
        const tableTop = new THREE.Mesh(tableTopGeometry, tableTopMaterial);
        tableTop.position.y = 0.5;
        tableTop.receiveShadow = true;
        scene.add(tableTop);
        
        // Ground (grass and sand)
        const groundGeometry = new THREE.PlaneGeometry(116, 116);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x90EE90 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 1.01;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Beach area
        const beachGeometry = new THREE.PlaneGeometry(40, 20);
        const beachMaterial = new THREE.MeshStandardMaterial({ color: 0xF4E4C1 });
        const beach = new THREE.Mesh(beachGeometry, beachMaterial);
        beach.rotation.x = -Math.PI / 2;
        beach.position.set(40, 1.02, 0);
        beach.receiveShadow = true;
        scene.add(beach);
        
        // Ocean
        const oceanGeometry = new THREE.PlaneGeometry(60, 40);
        const oceanMaterial = new THREE.MeshStandardMaterial({ color: 0x00BFFF, transparent: true, opacity: 0.8 });
        const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.set(70, 1.03, 0);
        scene.add(ocean);
        
        // Road system
        const roads = [];
        const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const roadMarkingMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
        
        function createRoad(x, z, width, length, rotationY = 0) {
            const roadGeo = new THREE.PlaneGeometry(width, length);
            const road = new THREE.Mesh(roadGeo, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.rotation.z = rotationY;
            road.position.set(x, 1.02, z);
            road.receiveShadow = true;
            scene.add(road);
            roads.push(road);
            
            // Road markings
            const markingGeo = new THREE.PlaneGeometry(0.3, length * 0.8);
            const marking = new THREE.Mesh(markingGeo, roadMarkingMaterial);
            marking.rotation.x = -Math.PI / 2;
            marking.rotation.z = rotationY;
            marking.position.set(x, 1.03, z);
            scene.add(marking);
        }
        
        // Main circular road around the city
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const x = Math.cos(angle) * 35;
            const z = Math.sin(angle) * 35;
            createRoad(x, z, 6, 30, angle + Math.PI / 2);
        }
        
        // Cross roads
        createRoad(0, 0, 6, 80);
        createRoad(0, 0, 80, 6, Math.PI / 2);
        
        // Beach road
        createRoad(50, 0, 6, 40);
        
        // Christ the Redeemer Statue
        const statueGroup = new THREE.Group();
        
        // Pedestal
        const pedestalGeo = new THREE.CylinderGeometry(3, 4, 8, 8);
        const pedestalMat = new THREE.MeshStandardMaterial({ color: 0xD2B48C });
        const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
        pedestal.castShadow = true;
        statueGroup.add(pedestal);
        
        // Statue body
        const bodyGeo = new THREE.CylinderGeometry(1.5, 2, 6, 8);
        const statueMat = new THREE.MeshStandardMaterial({ color: 0xE8E8E8 });
        const body = new THREE.Mesh(bodyGeo, statueMat);
        body.position.y = 7;
        body.castShadow = true;
        statueGroup.add(body);
        
        // Head
        const headGeo = new THREE.SphereGeometry(1.2, 16, 16);
        const head = new THREE.Mesh(headGeo, statueMat);
        head.position.y = 11;
        head.castShadow = true;
        statueGroup.add(head);
        
        // Arms
        const armGeo = new THREE.CylinderGeometry(0.4, 0.5, 5, 8);
        const leftArm = new THREE.Mesh(armGeo, statueMat);
        leftArm.position.set(-2.5, 9, 0);
        leftArm.rotation.z = Math.PI / 3;
        leftArm.castShadow = true;
        statueGroup.add(leftArm);
        
        const rightArm = new THREE.Mesh(armGeo, statueMat);
        rightArm.position.set(2.5, 9, 0);
        rightArm.rotation.z = -Math.PI / 3;
        rightArm.castShadow = true;
        statueGroup.add(rightArm);
        
        statueGroup.position.set(-30, 5, -30);
        scene.add(statueGroup);
        
        // Sugarloaf Mountain
        const sugarloafGroup = new THREE.Group();
        
        const mountainGeo = new THREE.ConeGeometry(12, 20, 8);
        const mountainMat = new THREE.MeshStandardMaterial({ color: 0x6B8E23 });
        const mountain = new THREE.Mesh(mountainGeo, mountainMat);
        mountain.castShadow = true;
        sugarloafGroup.add(mountain);
        
        const peakGeo = new THREE.SphereGeometry(4, 16, 16);
        const peak = new THREE.Mesh(peakGeo, mountainMat);
        peak.position.y = 18;
        peak.castShadow = true;
        sugarloafGroup.add(peak);
        
        sugarloafGroup.position.set(35, 10, -35);
        scene.add(sugarloafGroup);
        
        // Copacabana Beach buildings
        const buildingColors = [0xFF6B6B, 0x4ECDC4, 0x45B7D1, 0x96CEB4, 0xFFEAA7];
        
        function createBuilding(x, z, height, color) {
            const buildingGeo = new THREE.BoxGeometry(4, height, 4);
            const buildingMat = new THREE.MeshStandardMaterial({ color: color });
            const building = new THREE.Mesh(buildingGeo, buildingMat);
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            
            // Windows
            const windowGeo = new THREE.PlaneGeometry(0.5, 0.8);
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x87CEEB, emissive: 0x222222 });
            
            for (let wy = 1; wy < height - 1; wy += 2) {
                for (let wx = -1.5; wx <= 1.5; wx += 1.5) {
                    const windowMesh = new THREE.Mesh(windowGeo, windowMat);
                    windowMesh.position.set(x + wx, wy, z + 2.01);
                    scene.add(windowMesh);
                    
                    const windowBack = windowMesh.clone();
                    windowBack.position.set(x + wx, wy, z - 2.01);
                    windowBack.rotation.y = Math.PI;
                    scene.add(windowBack);
                }
            }
        }
        
        // Create beachfront buildings
        for (let i = 0; i < 8; i++) {
            const height = 6 + Math.random() * 8;
            const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
            createBuilding(45 + Math.random() * 10, -20 + i * 5, height, color);
        }
        
        // Maracanã Stadium
        const stadiumGroup = new THREE.Group();
        
        const stadiumBaseGeo = new THREE.CylinderGeometry(15, 16, 3, 32);
        const stadiumBaseMat = new THREE.MeshStandardMaterial({ color: 0xCCCCCC });
        const stadiumBase = new THREE.Mesh(stadiumBaseGeo, stadiumBaseMat);
        stadiumBase.castShadow = true;
        stadiumGroup.add(stadiumBase);
        
        const stadiumRingGeo = new THREE.TorusGeometry(14, 2, 16, 32);
        const stadiumRingMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
        const stadiumRing = new THREE.Mesh(stadiumRingGeo, stadiumRingMat);
        stadiumRing.rotation.x = Math.PI / 2;
        stadiumRing.position.y = 2;
        stadiumGroup.add(stadiumRing);
        
        stadiumGroup.position.set(-20, 1.5, 25);
        scene.add(stadiumGroup);
        
        // Palm trees (instanced)
        const palmTreeCount = 30;
        const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 3, 8);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const leavesGeo = new THREE.ConeGeometry(1.5, 2, 8);
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
        
        for (let i = 0; i < palmTreeCount; i++) {
            const treeGroup = new THREE.Group();
            
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.castShadow = true;
            treeGroup.add(trunk);
            
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 2.5;
            leaves.castShadow = true;
            treeGroup.add(leaves);
            
            const angle = Math.random() * Math.PI * 2;
            const radius = 20 + Math.random() * 25;
            treeGroup.position.set(Math.cos(angle) * radius, 1, Math.sin(angle) * radius);
            treeGroup.scale.setScalar(0.8 + Math.random() * 0.4);
            scene.add(treeGroup);
        }
        
        // Vehicles
        const vehicles = [];
        const carColors = [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFF00, 0xFF69B4, 0xFFA500, 0x800080, 0x00FFFF];
        const bikeColors = [0xFF4500, 0x32CD32, 0x4169E1, 0xFFD700];
        
        function createCar(color) {
            const carGroup = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.BoxGeometry(2, 1, 3.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            carGroup.add(body);
            
            // Cabin
            const cabinGeo = new THREE.BoxGeometry(1.8, 0.8, 2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x87CEEB });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.y = 1.5;
            cabin.position.z = -0.2;
            cabin.castShadow = true;
            carGroup.add(cabin);
            
            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            const wheelPositions = [
                [-1, 0.4, 1.2],
                [1, 0.4, 1.2],
                [-1, 0.4, -1.2],
                [1, 0.4, -1.2]
            ];
            
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });
            
            return carGroup;
        }
        
        function createBike(color) {
            const bikeGroup = new THREE.Group();
            
            // Frame
            const frameGeo = new THREE.BoxGeometry(0.3, 0.8, 1.5);
            const frameMat = new THREE.MeshStandardMaterial({ color: color });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.y = 0.6;
            frame.castShadow = true;
            bikeGroup.add(frame);
            
            // Wheels
            const wheelGeo = new THREE.TorusGeometry(0.5, 0.1, 8, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            const frontWheel = new THREE.Mesh(wheelGeo, wheelMat);
            frontWheel.position.set(0, 0.5, 0.8);
            frontWheel.castShadow = true;
            bikeGroup.add(frontWheel);
            
            const backWheel = new THREE.Mesh(wheelGeo, wheelMat);
            backWheel.position.set(0, 0.5, -0.8);
            backWheel.castShadow = true;
            bikeGroup.add(backWheel);
            
            // Handlebars
            const handlebarGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 8);
            const handlebar = new THREE.Mesh(handlebarGeo, frameMat);
            handlebar.rotation.x = Math.PI / 2;
            handlebar.position.set(0, 1.0, 0.6);
            bikeGroup.add(handlebar);
            
            return bikeGroup;
        }
        
        // Vehicle paths (circular and figure-8 patterns)
        const paths = [
            { radius: 35, speed: 1, direction: 1, yOffset: 0 },
            { radius: 25, speed: -1.2, direction: -1, yOffset: 0 },
            { radius: 15, speed: 1.5, direction: 1, yOffset: 0 },
            { radius: 35, speed: 0.8, direction: -1, yOffset: 0, offset: Math.PI }
        ];
        
        function addVehicle() {
            const isCar = Math.random() > 0.3;
            const colors = isCar ? carColors : bikeColors;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const vehicle = isCar ? createCar(color) : createBike(color);
            
            const pathIndex = Math.floor(Math.random() * paths.length);
            const path = paths[pathIndex];
            const angle = Math.random() * Math.PI * 2;
            
            vehicle.userData = {
                pathIndex,
                angle,
                speed: path.speed,
                direction: path.direction,
                yOffset: path.yOffset,
                isCar
            };
            
            scene.add(vehicle);
            vehicles.push(vehicle);
        }
        
        // Initialize vehicles
        for (let i = 0; i < 15; i++) {
            addVehicle();
        }
        
        // Tunnel section with cutaway
        const tunnelGroup = new THREE.Group();
        const tunnelGeo = new THREE.CylinderGeometry(5, 5, 20, 16, 1, true, 0, Math.PI);
        const tunnelMat = new THREE.MeshStandardMaterial({ 
            color: 0x666666, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.7
        });
        const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
        tunnel.rotation.z = Math.PI / 2;
        tunnel.rotation.y = Math.PI / 2;
        tunnel.castShadow = true;
        tunnelGroup.add(tunnel);
        
        tunnelGroup.position.set(0, 3, 0);
        scene.add(tunnelGroup);
        
        let tunnelCutaway = false;
        
        // UI Controls
        const vehicleCountSlider = document.getElementById('vehicleCount');
        const speedSlider = document.getElementById('speed');
        const vehicleCountValue = document.getElementById('vehicleCountValue');
        const speedValue = document.getElementById('speedValue');
        const toggleTunnelBtn = document.getElementById('toggleTunnel');
        const followVehicleBtn = document.getElementById('followVehicle');
        const resetCameraBtn = document.getElementById('resetCamera');
        const presetButtons = document.querySelectorAll('[data-preset]');
        
        let globalSpeed = 1.0;
        let followingVehicle = false;
        let currentFollowIndex = 0;
        
        vehicleCountSlider.addEventListener('input', (e) => {
            const count = parseInt(e.target.value);
            vehicleCountValue.textContent = count;
            
            while (vehicles.length < count) {
                addVehicle();
            }
            while (vehicles.length > count) {
                const vehicle = vehicles.pop();
                scene.remove(vehicle);
            }
        });
        
        speedSlider.addEventListener('input', (e) => {
            globalSpeed = parseFloat(e.target.value);
            speedValue.textContent = globalSpeed.toFixed(1);
        });
        
        toggleTunnelBtn.addEventListener('click', () => {
            tunnelCutaway = !tunnelCutaway;
            tunnel.rotation.y = tunnelCutaway ? 0 : Math.PI / 2;
            tunnelMat.opacity = tunnelCutaway ? 0.3 : 0.7;
        });
        
        followVehicleBtn.addEventListener('click', () => {
            followingVehicle = !followingVehicle;
            followVehicleBtn.classList.toggle('active', followingVehicle);
            if (followingVehicle && vehicles.length > 0) {
                currentFollowIndex = Math.floor(Math.random() * vehicles.length);
            }
        });
        
        resetCameraBtn.addEventListener('click', () => {
            followingVehicle = false;
            followVehicleBtn.classList.remove('active');
            camera.position.set(50, 40, 50);
            camera.lookAt(0, 0, 0);
        });
        
        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                followingVehicle = false;
                followVehicleBtn.classList.remove('active');
                
                const preset = btn.dataset.preset;
                switch(preset) {
                    case 'full':
                        camera.position.set(50, 40, 50);
                        camera.lookAt(0, 0, 0);
                        break;
                    case 'beach':
                        camera.position.set(60, 15, 10);
                        camera.lookAt(45, 5, 0);
                        break;
                    case 'statue':
                        camera.position.set(-40, 20, -40);
                        camera.lookAt(-30, 10, -30);
                        break;
                    case 'street':
                        camera.position.set(20, 3, 20);
                        camera.lookAt(0, 0, 0);
                        break;
                }
            });
        });
        
        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Update vehicles
            vehicles.forEach((vehicle, index) => {
                const path = paths[vehicle.userData.pathIndex];
                vehicle.userData.angle += vehicle.userData.speed * globalSpeed * delta * 0.5;
                
                const x = Math.cos(vehicle.userData.angle) * path.radius;
                const z = Math.sin(vehicle.userData.angle) * path.radius;
                
                vehicle.position.set(x, vehicle.userData.yOffset, z);
                vehicle.rotation.y = vehicle.userData.angle + (vehicle.userData.direction * Math.PI / 2);
                
                // Add slight bounce for cars
                if (vehicle.userData.isCar) {
                    vehicle.position.y += Math.sin(time * 10 + index) * 0.02;
                }
            });
            
            // Follow vehicle logic
            if (followingVehicle && vehicles.length > 0) {
                const targetVehicle = vehicles[currentFollowIndex];
                const offset = new THREE.Vector3(5, 3, 5);
                const targetPosition = targetVehicle.position.clone().add(offset);
                
                camera.position.lerp(targetPosition, 0.05);
                camera.lookAt(targetVehicle.position);
                
                // Switch to random vehicle occasionally
                if (Math.random() < 0.001) {
                    currentFollowIndex = Math.floor(Math.random() * vehicles.length);
                }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
